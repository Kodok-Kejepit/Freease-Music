# Build APK Freease otomatis lalu terbitkan di halaman Releases.
#
# Jalankan: tab Actions → "Build APK" → Run workflow, atau push tag versi (mis. v2.0.0).
# APK ditandatangani dengan kunci rilis dari GitHub Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    isi berkas .jks dalam base64 (base64 -w0 freease-release.jks)
#   KEYSTORE_PASSWORD  kata sandi keystore (storePassword)
#   KEY_ALIAS          nama alias kunci (keyAlias)
#   KEY_PASSWORD       kata sandi kunci (keyPassword)
# Dengan kunci yang sama, APK baru bisa langsung memperbarui Freease yang sudah terpasang.

name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Pasang kunci rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secret kunci rilis belum lengkap (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          # Buang spasi/baris baru yang ikut tersalin dari terminal atau HP.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/freease-release.jks" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 bukan base64 yang valid. Salin ulang seluruh isi kunci-base64.txt."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/freease-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Kunci tidak bisa dibuka. Cek KEYSTORE_PASSWORD dan KEY_ALIAS, atau salin ulang KEYSTORE_BASE64 (mungkin terpotong)."
            exit 1
          fi
          {
            echo "storeFile=$RUNNER_TEMP/freease-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Cek klip Suara Dev
        run: |
          if ls android/app/src/main/assets/voice_dev/*.ogg >/dev/null 2>&1; then
            echo "Suara Dev disertakan."
          else
            echo "::notice::Klip Suara Dev tidak ada di repo — asisten memakai suara bawaan HP."
          fi

      - name: Build APK rilis
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Siapkan berkas
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          cp android/app/build/outputs/apk/release/app-release.apk "Freease-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=Freease-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Terbitkan di Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "Freease $VERSION" --notes "APK Freease $VERSION untuk Android 8.0 ke atas. Unduh berkas **$FILE** di bawah, lalu buka untuk memasang."
          fi

      - name: Hapus kunci dari mesin build
        if: always()
        run: rm -f "$RUNNER_TEMP/freease-release.jks" android/keystore.properties
